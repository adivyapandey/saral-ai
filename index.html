<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saral AI - Open Source Simplifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-xl w-full border border-slate-200">
    <div class="flex items-center gap-2 mb-2">
      <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Open Source AI • Llama Powered</span>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">सरल AI (Saral AI)</h1>
    <p class="text-sm text-slate-500 mb-6">किसी भी कठिन दस्तावेज़ या नियम को आसान भाषा में समझें।</p>

    <label class="block text-sm font-medium text-slate-700 mb-2">यहाँ कठिन टेक्स्ट पेस्ट करें:</label>
    <textarea id="inputText" rows="4" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-slate-800" placeholder="उदा. कोई सरकारी आदेश, नियम या कॉलेज का कठिन नोटिस..."></textarea>

    <button onclick="simplifyText()" id="submitBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition duration-200">
      सरल भाषा में समझाइए ✨
    </button>

    <div id="resultBox" class="mt-6 p-4 bg-slate-100 rounded-lg border border-slate-200 hidden">
      <h3 class="font-semibold text-slate-700 mb-1">आसान सारांश:</h3>
      <p id="outputText" class="text-slate-700 whitespace-pre-line text-sm"></p>
    </div>
  </div>

  <script>
    async function simplifyText() {
      const text = document.getElementById("inputText").value.trim();
      const btn = document.getElementById("submitBtn");
      const resultBox = document.getElementById("resultBox");
      const outputText = document.getElementById("outputText");

      if (!text) {
        alert("कृपया पहले कुछ टेक्स्ट लिखें!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "AI सोच रहा है...";
      resultBox.classList.remove("hidden");
      outputText.innerText = "लोड हो रहा है...";

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [
              {
                role: "system",
                content: "You are an AI assistant that simplifies legal and official text into exactly 3 easy-to-understand Hindi bullet points. Output only the 3 bullet points."
              },
              {
                role: "user",
                content: text
              }
            ],
            model: "openai"
          })
        });

        if (!response.ok) {
          throw new Error("HTTP Status " + response.status);
        }

        const data = await response.text();
        outputText.innerText = data;
      } catch (err) {
        outputText.innerText = "एरर आया: " + err.message + "। कृपया दोबारा प्रयास करें।";
      } finally {
        btn.disabled = false;
        btn.innerText = "सरल भाषा में समझाइए ✨";
      }
    }
  </script>
</body>
</html>
